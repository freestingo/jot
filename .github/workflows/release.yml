name: Upload release assets

on:
  release:
    types: [created]

jobs:
  build:
    name: Upload release assets
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [win-x64, win-x86, win-arm64, linux-x64, osx-x64, osx-arm64]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish single-file executable for ${{ matrix.runtime }}
        run: |
          dotnet publish -c Release -r ${{ matrix.runtime }} \
            --self-contained true \
            /p:PublishSingleFile=true \
            -o ./publish/${{ matrix.runtime }}

      - name: Zip the published folder
        run: |
          cd publish
          zip -r ../${{ matrix.runtime }}.zip ${{ matrix.runtime }}
          cd ..

      - name: Upload single-file binary for ${{ matrix.runtime }}
        uses: AButler/upload-release-assets@v3.0
        with:
          files: ./${{ matrix.runtime }}.zip
          repo-token: ${{ secrets.GITHUB_TOKEN }}
